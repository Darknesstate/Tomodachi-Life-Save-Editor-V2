name: CI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          pacman -Sy --noconfirm 3ds-bannertool || true
          mkdir -p $HOME/cia-tools /tmp/3dstools
          curl -fL https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.17/makerom-v0.17-ubuntu_x86_64.zip -o /tmp/m.zip
          unzip -j -o /tmp/m.zip -d $HOME/cia-tools
          chmod +x $HOME/cia-tools/makerom || true
          cp $HOME/cia-tools/makerom /opt/devkitpro/tools/bin/makerom || true
          chmod +x /opt/devkitpro/tools/bin/makerom || true
          echo $HOME/cia-tools >> $GITHUB_PATH
          echo /opt/devkitpro/tools/bin >> $GITHUB_PATH
          git clone --depth 1 --branch cxi-stuff https://github.com/devkitPro/3dstools.git /tmp/3dstools || true
          make -C /tmp/3dstools -j2 || true
          ls -lh /tmp/3dstools/cxitool || true
          cp /tmp/3dstools/cxitool $HOME/cia-tools/cxitool || true
          cp /tmp/3dstools/cxitool /opt/devkitpro/tools/bin/cxitool || true
          chmod +x $HOME/cia-tools/cxitool || true
          which bannertool || true
          ls -lh /opt/devkitpro/tools/bin/bannertool || true
          which makerom || true
          which cxitool || true
      - name: AutoFix
        run: |
          ls -lh assets
          cat cia.rsf || true
          sed -i s/StackSize:\ 0x00000000/StackSize:\ 0x40000/ cia.rsf
          grep StackSize cia.rsf || true
          rm -f assets/sound.wav
          LC_ALL=C awk 'BEGIN{rate=22050;total=44100;printf "%c%c%c%c",82,73,70,70;sz=36+total*2;printf "%c%c%c%c",sz%256,int(sz/256)%256,int(sz/65536)%256,int(sz/16777216)%256;printf "%c%c%c%c",87,65,86,69;printf "%c%c%c%c",102,109,116,32;printf "%c%c%c%c",16,0,0,0;printf "%c%c",1,0;printf "%c%c",1,0;printf "%c%c%c%c",rate%256,int(rate/256)%256,0,0;printf "%c%c%c%c",(rate*2)%256,int(rate*2/256)%256,0,0;printf "%c%c",2,0;printf "%c%c",16,0;printf "%c%c%c%c",100,97,116,97;dsz=total*2;printf "%c%c%c%c",dsz%256,int(dsz/256)%256,int(dsz/65536)%256,int(dsz/16777216)%256;for(i=0;i<total;i++){t=i/rate;if(t<0.25)f=523;else if(t<0.5)f=659;else if(t<0.75)f=784;else if(t<1.25)f=1046;else if(t<1.5)f=784;else if(t<1.75)f=659;else f=523;s=int(12000*sin(2*3.14159265*f*i/rate));lo=s%256;if(lo<0)lo+=256;hi=int(s/256)%256;if(hi<0)hi+=256;printf "%c%c",lo,hi}}' > assets/sound.wav
          ls -lh assets
          od -An -tx1 -N 8 assets/sound.wav || true
      - name: Build
        run: |
          export PATH=/opt/devkitpro/tools/bin:$HOME/cia-tools:$PATH
          set -x
          make || true
          find . -name "*.elf" || true
          find . -name "*.3dsx" || true
          find . -name "*.smdh" || true
      - name: BuildCIA
        run: |
          export PATH=/opt/devkitpro/tools/bin:$HOME/cia-tools:$PATH
          set -x
          ELF=$(find . -name "TomodachiLifeSaveEditorV2.elf" | head -n 1)
          DSX=$(find . -name "TomodachiLifeSaveEditorV2.3dsx" | head -n 1)
          SMDH=$(find . -name "TomodachiLifeSaveEditorV2.smdh" | head -n 1)
          echo ELF=$ELF > makerom.log
          echo DSX=$DSX >> makerom.log
          echo SMDH=$SMDH >> makerom.log
          ls -lh build || true
          bannertool makebanner -i assets/banner.png -a assets/sound.wav -o build/banner.bnr >> makerom.log 2>&1 || bannertool makebanner -i assets/banner.png -o build/banner.bnr >> makerom.log 2>&1 || echo SEM-BANNER >> makerom.log
          ls -lh build/banner.bnr || true
          echo METODO1-MAKEROM-SEM-BANNER >> makerom.log
          makerom -f cia -o build/TomodachiLifeSaveEditorV2.cia -DAPP_ENCRYPTED=false -rsf cia.rsf -target t -exefslogo -elf $ELF -icon $SMDH >> makerom.log 2>&1 || echo FALHOU-SEM-BANNER >> makerom.log
          echo METODO1B-MAKEROM-COM-BANNER >> makerom.log
          test -f build/TomodachiLifeSaveEditorV2.cia || makerom -f cia -o build/TomodachiLifeSaveEditorV2.cia -DAPP_ENCRYPTED=false -rsf cia.rsf -target t -exefslogo -elf $ELF -icon $SMDH -banner build/banner.bnr >> makerom.log 2>&1 || echo FALHOU-COM-BANNER >> makerom.log
          echo METODO1C-MAKEROM-SO-ELF >> makerom.log
          test -f build/TomodachiLifeSaveEditorV2.cia || makerom -f cia -o build/TomodachiLifeSaveEditorV2.cia -DAPP_ENCRYPTED=false -rsf cia.rsf -target t -exefslogo -elf $ELF >> makerom.log 2>&1 || echo FALHOU-SO-ELF >> makerom.log
          echo METODO2-CXITOOL >> makerom.log
          test -f build/TomodachiLifeSaveEditorV2.cia || cxitool -t 0004000000133700 -n "Tomodachi Life Save Editor V2" -b assets/banner.png $DSX build/TomodachiLifeSaveEditorV2.cxi >> makerom.log 2>&1 || echo FALHOU-CXITOOL >> makerom.log
          ls -lh build/*.cxi || true
          test -f build/TomodachiLifeSaveEditorV2.cia || makerom -f cia -o build/TomodachiLifeSaveEditorV2.cia -target t -i build/TomodachiLifeSaveEditorV2.cxi:0:0 >> makerom.log 2>&1 || echo FALHOU-MAKEROM-CXI >> makerom.log
          cat makerom.log || true
          ls -lh build/*.cia || true
          ls -lh build/*.cxi || true
      - uses: actions/upload-artifact@v4
        with:
          name: Tomodachi-V2
          if-no-files-found: warn
          path: |
            build/*.3dsx
            build/*.smdh
            build/*.cia
            build/*.cxi
            makerom.log
            *.3dsx
            *.smdh
            *.cia
