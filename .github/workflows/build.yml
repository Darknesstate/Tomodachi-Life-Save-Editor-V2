# Tomodachi Life Save Editor V2
# ESQUELETO da versao pronta - mesmo build que ja funcionou
# Arquivo: .github/workflows/build.yml
name: Build 3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .3dsx + .cia
        run: |
          make -j$(nproc)

      - name: Upload .3dsx e .cia
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiLifeSaveEditorV2-3DS
          path: |
            *.3dsx
            *.cia
            *.smdh
