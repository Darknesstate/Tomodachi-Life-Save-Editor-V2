name: CI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export PATH=/opt/devkitpro/tools/bin:$PATH
          set -x
          make || true
          ls -lh build || true
      - name: BuildCIA
        run: |
          export PATH=/opt/devkitpro/tools/bin:$PATH
          set -x
          ls -lh build || true
          ls -lh build/*.3dsx || true
          ls -lh build/*.smdh || true
          3dsxtool --cia=build/TomodachiLifeSaveEditorV2.cia build/TomodachiLifeSaveEditorV2.3dsx --smdh=build/TomodachiLifeSaveEditorV2.smdh || true
          ls -lh build/*.cia || true
      - uses: actions/upload-artifact@v4
        with:
          name: Tomodachi-V2
          if-no-files-found: warn
          path: |
            build/*.3dsx
            build/*.smdh
            build/*.cia
            *.3dsx
            *.smdh
            *.cia
