name: build
"on":
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
            - uses: actions/checkout@v4
            - name: Build
        run: |
          python3 << 'PY'
          import wave
          w = wave.open('assets/sound.wav', 'wb')
          w.setnchannels(1)
          w.setsampwidth(2)
          w.setframerate(22050)
          w.writeframes(b'\x00\x00' * 66150)
          w.close()
          PY
          make
            - uses: actions/upload-artifact@v4
        with:
          name: Tomodachi-V2
          path: |
            *.3dsx
            *.smdh
            *.cia
