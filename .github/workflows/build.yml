name: Build 3DS
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build .3dsx
        run: |
          make -j$(nproc)
      - name: Upload .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiLifeSaveEditorV2-3DS
          path: |
            *.3dsx
            *.smdh
