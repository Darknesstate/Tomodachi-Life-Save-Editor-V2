name: Build 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiLifeSaveEditorV2
          path: |
            TomodachiLifeSaveEditorV2.3dsx
            TomodachiLifeSaveEditorV2.smdh
            TomodachiLifeSaveEditorV2.elf
