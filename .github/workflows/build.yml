name: CI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          mkdir -p $HOME/cia-tools
          curl -fL https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip -o /tmp/b.zip
          unzip -j -o /tmp/b.zip -d $HOME/cia-tools
          curl -fL https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.17/makerom-v0.17-ubuntu_x86_64.zip -o /tmp/m.zip
          unzip -j -o /tmp/m.zip -d $HOME/cia-tools
          chmod +x $HOME/cia-tools/bannertool $HOME/cia-tools/makerom
          echo $HOME/cia-tools >> $GITHUB_PATH
          ls -lh $HOME/cia-tools
      - name: AutoFix
        run: |
          ls -lh assets
          cat cia.rsf || true
          sed -i s/StackSize:\ 0x00000000/StackSize:\ 0x40000/ cia.rsf
          grep StackSize cia.rsf || true
          test -f assets/sound.wav || { printf \\122\\111\\106\\106\\150\\254\\000\\000\\127\\101\\126\\105\\146\\155\\164\\040\\020\\000\\000\\000\\001\\000\\001\\000\\042\\126\\000\\000\\104\\254\\000\\000\\002\\000\\020\\000\\144\\141\\164\\141\\104\\254\\000\\000 > assets/sound.wav; dd if=/dev/zero bs=1 count=44100 >> assets/sound.wav; }
          ls -lh assets
          od -An -tx1 -N 8 assets/icon.png || true
          od -An -tx1 -N 8 assets/banner.png || true
          od -An -tx1 -N 8 assets/sound.wav || true
      - name: Build
        run: |
          export PATH=$HOME/cia-tools:$PATH
          set -x
          make || true
          ls -lh build || true
          ls -lh build/*.cia || echo CIA_AINDA_FALTOU
      - name: BuildCIA
        run: |
          export PATH=$HOME/cia-tools:$PATH
          set -x
          ls -lh build || true
          test -f build/TomodachiLifeSaveEditorV2.cia || test -f TomodachiLifeSaveEditorV2.cia || echo TENTA_MANUAL
          test -f build/TomodachiLifeSaveEditorV2.cia || test -f TomodachiLifeSaveEditorV2.cia || bannertool makebanner -i assets/banner.png -a assets/sound.wav -o build/banner.bnr || bannertool makebanner -i assets/banner.png -o build/banner.bnr || echo [STRIPPED 264 bytes] | base64 -d > /tmp/fb.png
          test -f build/banner.bnr || bannertool makebanner -i /tmp/fb.png -o build/banner.bnr || true
          ls -lh build/banner.bnr || true
          test -f build/icon.icn || bannertool makesmdh -s TomodachiLifeSaveEditorV2 -l TomodachiLifeSaveEditorV2 -p DarknessMetal -i assets/icon.png -o build/icon.icn || cp build/TomodachiLifeSaveEditorV2.smdh build/icon.icn || echo [STRIPPED 176 bytes] | base64 -d > /tmp/fi.png
          test -f build/icon.icn || bannertool makesmdh -s TomodachiLifeSaveEditorV2 -l TomodachiLifeSaveEditorV2 -p DarknessMetal -i /tmp/fi.png -o build/icon.icn || true
          ls -lh build/icon.icn || true
          ls -lh build/*.elf || true
          test -f build/TomodachiLifeSaveEditorV2.cia || makerom -f cia -o build/TomodachiLifeSaveEditorV2.cia -rsf cia.rsf -target t -exefslogo -elf build/TomodachiLifeSaveEditorV2.elf -icon build/icon.icn -banner build/banner.bnr || makerom -f cia -o build/TomodachiLifeSaveEditorV2.cia -rsf cia.rsf -target t -exefslogo -elf build/TomodachiLifeSaveEditorV2.elf -icon build/icon.icn || makerom -f cia -o build/TomodachiLifeSaveEditorV2.cia -rsf cia.rsf -target t -exefslogo -elf build/TomodachiLifeSaveEditorV2.elf || true
          ls -lh build/*.cia || true
      - uses: actions/upload-artifact@v4
        with:
          name: Tomodachi-V2
          if-no-files-found: warn
          path: |
            build/*.3dsx
            build/*.smdh
            build/*.cia
            *.3dsx
            *.smdh
            *.cia
